name: CI/CD Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NET_IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-test:
    name: Build & Test .NET App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore GP35.SRIS.sln

    - name: Build Solution
      run: dotnet build GP35.SRIS.sln --no-restore -c Release

    - name: Run Tests
      run: |
        if [ -d "Tests" ]; then
          dotnet test GP35.SRIS.sln --no-build -c Release
        else
          echo "No Tests directory found, skipping tests."
        fi

  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Build and push .NET Backend API Image
    - name: Extract metadata (tags, labels) for .NET Backend
      id: meta-net
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.NET_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha,format=short
          latest

    - name: Build and push .NET Backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ steps.meta-net.outputs.tags }}
        labels: ${{ steps.meta-net.outputs.labels }}
