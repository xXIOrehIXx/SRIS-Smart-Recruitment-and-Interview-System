apiVersion: apps/v1
kind: Deployment
metadata:
  name: sris-frontend
  labels:
    app: sris-frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sris-frontend
  template:
    metadata:
      labels:
        app: sris-frontend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: sris-frontend
        image: ghcr.io/xxiorehixx/sris-smart-recruitment-and-interview-system-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          hostPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: sris-frontend
spec:
  type: ClusterIP
  selector:
    app: sris-frontend
  ports:
  - port: 80
    targetPort: 80
