name: Deploy AI API

on:
  push:
    branches: [ main, master, feature/ntsan_dep_k0s ]
    paths:
      - 'Development/backend/ai-service/**'
      - '.github/workflows/deploy-ai-api.yml'
  pull_request:
    branches: [ main, master, feature/ntsan_dep_k0s ]
    paths:
      - 'Development/backend/ai-service/**'
      - '.github/workflows/deploy-ai-api.yml'

permissions:
  contents: read
  packages: write

concurrency: 
  group: deploy-ai-api
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  AI_IMAGE_NAME: xxiorehixx/sris-smart-recruitment-and-interview-system-ai-service

jobs:
  build-and-push-docker:
    name: Build & Push AI API Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta-ai
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.AI_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha,format=short
          latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./Development/backend/ai-service
        file: ./Development/backend/ai-service/Dockerfile
        push: true
        tags: ${{ steps.meta-ai.outputs.tags }}
        labels: ${{ steps.meta-ai.outputs.labels }}

  deploy:
    name: Update Helm Chart (GitOps)
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    if: github.event_name == 'push'

    steps:
    - name: Checkout Helm Chart repo
      uses: actions/checkout@v4
      with:
        repository: sannxt244/sris-helm-chart
        token: ${{ secrets.HELM_REPO_PAT }}
        path: sris-helm-chart

    - name: Update values.yaml
      run: |
        cd sris-helm-chart
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        sed -i "/srisAiApi:/,/tag:/ s/tag:.*/tag: sha-$SHORT_SHA/" values.yaml
        
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add values.yaml
        git commit -m "Update srisAiApi tag to sha-$SHORT_SHA" || echo "No changes to commit"
        git push

  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [build-and-push-docker, deploy]
    if: always()
    steps:
    - name: Send Status to Discord
      run: |
        if [ "${{ needs.build-and-push-docker.result }}" = "failure" ] || [ "${{ needs.deploy.result }}" = "failure" ]; then
          EMOJI="❌"
          STATUS_TEXT="Thất bại"
        else
          EMOJI="✅"
          STATUS_TEXT="Thành công"
        fi
        
        COMMIT_MSG=$(jq -Rs . <<< "${{ github.event.head_commit.message }}")
        COMMIT_MSG="${COMMIT_MSG%\"}"
        COMMIT_MSG="${COMMIT_MSG#\"}"
        
        MESSAGE="**$EMOJI Luồng AI API $STATUS_TEXT!**
        **Branch**: \`${{ github.ref_name }}\`
        **Commit**: \`$COMMIT_MSG\`
        **Log chi tiết**: [Nhấn vào đây](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        
        JSON_PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')
        curl -H "Content-Type: application/json" -d "$JSON_PAYLOAD" ${{ secrets.DISCORD_WEBHOOK }}
