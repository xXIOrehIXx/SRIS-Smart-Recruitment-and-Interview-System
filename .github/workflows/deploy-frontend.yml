name: Deploy Frontend

on:
  push:
    branches: [ main, master, feature/ntsan_dep_k0s ]
    paths:
      - 'Development/frontend/**'
      - 'Development/k8s/frontend.yaml'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [ main, master, feature/ntsan_dep_k0s ]
    paths:
      - 'Development/frontend/**'
      - 'Development/k8s/frontend.yaml'
      - '.github/workflows/deploy-frontend.yml'

permissions:
  contents: read
  packages: write

concurrency: 
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FE_IMAGE_NAME: xxiorehixx/sris-smart-recruitment-and-interview-system-frontend

jobs:
  build-and-push-docker:
    name: Build & Push Frontend Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Frontend
      id: meta-fe
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.FE_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha,format=short
          latest

    - name: Build and push Frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./Development/frontend
        file: ./Development/frontend/Dockerfile
        push: true
        tags: ${{ steps.meta-fe.outputs.tags }}
        labels: ${{ steps.meta-fe.outputs.labels }}

  deploy:
    name: Restart Frontend to Pull New Image
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    if: github.event_name == 'push'

    steps:
    - name: Trigger K8s Rollout Restart
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        timeout: 60s 
        script: |
          echo "=== Yêu cầu K8s khởi động lại Pod để nhận Image mới ==="
          sudo k0s kubectl rollout restart deployment sris-frontend
          sudo k0s kubectl rollout status deployment sris-frontend --timeout=120s

  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [build-and-push-docker, deploy]
    if: always()
    steps:
    - name: Send Status to Discord
      run: |
        # Đánh giá tổng thể: Nếu có bất kỳ job nào thất bại thì coi là Thất bại
        if [ "${{ needs.build-and-push-docker.result }}" = "failure" ] || [ "${{ needs.deploy.result }}" = "failure" ]; then
          EMOJI="❌"
          STATUS_TEXT="Thất bại"
        else
          EMOJI="✅"
          STATUS_TEXT="Thành công"
        fi
        
        COMMIT_MSG=$(jq -Rs . <<< "${{ github.event.head_commit.message }}")
        COMMIT_MSG="${COMMIT_MSG%\"}"
        COMMIT_MSG="${COMMIT_MSG#\"}"
        
        MESSAGE="**$EMOJI Luồng Frontend $STATUS_TEXT!**
        **Branch**: \`${{ github.ref_name }}\`
        **Commit**: \`$COMMIT_MSG\`
        **Log chi tiết**: [Nhấn vào đây](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        
        JSON_PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')
        curl -H "Content-Type: application/json" -d "$JSON_PAYLOAD" ${{ secrets.DISCORD_WEBHOOK }}
