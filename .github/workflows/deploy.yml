name: CI/CD Build and Deploy Backend

on:
  push:
    branches: [ main, master, feature/ntsan_dep ]
    paths:
      - 'Development/backend/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main, master, feature/ntsan_dep ]
    paths:
      - 'Development/backend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NET_IMAGE_NAME: xxxiorehixx/sris-smart-recruitment-and-interview-system-backend

jobs:
  build-and-test:
    name: Build & Test .NET App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Development/backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore GP35.SRIS.sln

    - name: Build Solution
      run: dotnet build GP35.SRIS.sln --no-restore -c Release

    - name: Run Tests
      run: |
        if [ -d "Tests" ]; then
          dotnet test GP35.SRIS.sln --no-build -c Release
        else
          echo "No Tests directory found, skipping tests."
        fi

  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Build and push .NET Backend API Image
    - name: Extract metadata (tags, labels) for .NET Backend
      id: meta-net
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.NET_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha,format=short
          latest

    - name: Build and push .NET Backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./Development/backend
        file: ./Development/backend/Dockerfile
        push: true
        tags: ${{ steps.meta-net.outputs.tags }}
        labels: ${{ steps.meta-net.outputs.labels }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    if: github.event_name == 'push'

    steps:
    - name: SSH and Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        timeout: 600s 
        script: |
          set -e
          echo "=== 1. Đăng nhập vào GitHub Container Registry ==="
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          echo "=== 2. Kéo (Pull) Docker image mới nhất từ GHCR ==="
          docker pull ghcr.io/${{ env.NET_IMAGE_NAME }}:latest
          
          echo "=== 3. Dừng và xóa container cũ ==="
          docker stop sris-backend || true
          docker rm sris-backend || true
          
          echo "=== 4. Khởi chạy container mới ==="
          docker run -d \
            -p 80:8080 \
            --name sris-backend \
            --restart unless-stopped \
            ghcr.io/${{ env.NET_IMAGE_NAME }}:latest
            
          echo "=== 5. Dọn dẹp các Docker image cũ rác ==="
          docker image prune -f
          
          echo "=== Deploy hoàn tất thành công! ==="
